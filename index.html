<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIZIONARIO</title>
<style>
  :root {
    --sfondo: #FBF4E2;
    --carta: #FFFFFF;
    --testo: #1B1B1B;
    --bordo: #2B2B2B;
    --significato: #0A4DB0;
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body {
    margin: 0;
    background: var(--sfondo);
    color: var(--testo);
    font-family: Verdana, Tahoma, "DejaVu Sans", Arial, sans-serif;
    line-height: 1.8;
    letter-spacing: 0.05em;
    word-spacing: 0.15em;
    text-align: left;
    text-transform: uppercase;
  }
  main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.2rem 3rem; }
  h1 { font-size: 2rem; line-height: 1.4; margin: 0.4rem 0 1.6rem; }
  label { display: block; font-size: 1.25rem; font-weight: bold; margin-bottom: 0.6rem; }
  input[type="text"] {
    width: 100%;
    font: inherit; font-size: 2rem; letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.5rem 0.9rem;
    border: 3px solid var(--bordo); border-radius: 12px;
    background: var(--carta); color: var(--testo);
  }
  input[type="text"]:focus { outline: 4px solid #2563EB; outline-offset: 2px; }
  #scheda {
    margin-top: 1.8rem;
    background: var(--carta);
    border: 3px solid var(--bordo); border-radius: 16px;
    padding: 1.2rem 1.4rem 1.4rem;
  }
  #scheda[hidden] { display: none; }
  .parola { font-size: 2.6rem; font-weight: bold; line-height: 1.3; margin: 0 0 0.5rem; }
  .riga { font-size: 1.6rem; margin: 0.4rem 0; }
  .sig { color: var(--significato); font-weight: bold; }
  #ascolta {
    font: inherit; font-size: 1.2rem; font-weight: bold; letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 0.8rem; padding: 0.5rem 1.2rem; min-height: 3rem;
    border: 3px solid var(--bordo); border-radius: 12px;
    background: #FFE08A; color: var(--testo); cursor: pointer;
  }
  #ascolta[hidden] { display: none; }
  #ascolta:hover { background: #FFD25A; }
  #ascolta:focus-visible { outline: 4px solid #2563EB; outline-offset: 2px; }
  .nota { margin-top: 2.5rem; font-size: 1rem; line-height: 1.9; color: #3A3A3A; border-top: 2px dashed #CFC6AE; padding-top: 1rem; }
  .nota p { margin: 0.2rem 0; }
  @media (max-width: 480px) {
    html { font-size: 18px; }
    .parola { font-size: 2.2rem; }
  }
</style>
</head>
<body>
<main>
  <h1>DIZIONARIO</h1>

  <label for="parola">CERCA LA PAROLA IN LATINO.</label>
  <input id="parola" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

  <section id="scheda" aria-live="polite" hidden>
    <p class="parola" id="titolo"></p>
    <p class="riga" id="genere"></p>
    <p class="riga">SIGNIFICATO: <span class="sig" id="significato"></span></p>
    <button type="button" id="ascolta" hidden>🔊 ASCOLTA</button>
  </section>

  <div class="nota">
    <p>PER INGRANDIRE: TIENI PREMUTO "CTRL" E PREMI "+".</p>
    <p>PER RIMPICCIOLIRE: TIENI PREMUTO "CTRL" E PREMI "-".</p>
  </div>
</main>

<script>
// [nominativo, genitivo, genere, significato]
// m = maschile, f = femminile, mf = maschile e femminile
var PAROLE = [
  ["vox", "vocis", "f", "voce"],
  ["rex", "regis", "m", "re"],
  ["pax", "pacis", "f", "pace"],
  ["grex", "gregis", "m", "gregge"],
  ["crux", "crucis", "f", "croce"],
  ["aetas", "aetatis", "f", "età"],
  ["pes", "pedis", "m", "piede"],
  ["salus", "salutis", "f", "salute"],
  ["custos", "custodis", "mf", "custode"],
  ["libertas", "libertatis", "f", "libertà"],
  ["amor", "amoris", "m", "amore"],
  ["consul", "consulis", "m", "console"],
  ["timor", "timoris", "m", "paura"],
  ["exul", "exulis", "mf", "esule"],
  ["soror", "sororis", "f", "sorella"],
  ["leo", "leonis", "m", "leone"],
  ["regio", "regionis", "f", "regione"],
  ["praedo", "praedonis", "m", "predone"],
  ["legio", "legionis", "f", "legione"],
  ["centurio", "centurionis", "m", "centurione"],
  ["urbs", "urbis", "f", "città"],
  ["plebs", "plebis", "f", "plebe"],
  ["stirps", "stirpis", "f", "stirpe"],
  ["ops", "opis", "f", "aiuto"],
  ["trabs", "trabis", "f", "trave"],
  ["lux", "lucis", "f", "luce"],
  ["civitas", "civitatis", "f", "cittadinanza"],
  ["dolor", "doloris", "m", "dolore"],
  ["sermo", "sermonis", "m", "discorso"],
  ["lex", "legis", "f", "legge"],
  ["laus", "laudis", "f", "lode"],
  ["sol", "solis", "m", "sole"],
  ["natio", "nationis", "f", "popolo"],
  ["dux", "ducis", "mf", "comandante"]
];

var GENERI = { m: "MASCHILE", f: "FEMMINILE", mf: "MASCHILE E FEMMINILE" };

// Solo per la voce: come si pronuncia ogni parola in latino ecclesiastico,
// scritta in modo che la voce italiana del dispositivo la legga bene
// (accento solo dove la voce italiana sbaglierebbe sillaba, ae = "e", ti + vocale = "zi").
// [lettura del nominativo, lettura del genitivo]
var LETTURA = {
  vox: ["vox", "vocis"],
  rex: ["rex", "regis"],
  pax: ["pax", "pacis"],
  grex: ["grex", "gregis"],
  crux: ["crúx", "crucis"],
  aetas: ["etas", "etatis"],
  pes: ["pes", "pedis"],
  salus: ["salus", "salutis"],
  custos: ["custos", "custodis"],
  libertas: ["libértas", "libertatis"],
  amor: ["amor", "amoris"],
  consul: ["cònsul", "cònsulis"],
  timor: ["timor", "timoris"],
  exul: ["éxul", "éxulis"],
  soror: ["so-ror", "sororis"],
  leo: ["leo", "leónis"],
  regio: ["regio", "regiónis"],
  praedo: ["prédo", "predonis"],
  legio: ["legio", "legiónis"],
  centurio: ["centurio", "centuriónis"],
  urbs: ["ùrbs", "urbis"],
  plebs: ["plebs", "plebis"],
  stirps: ["stirps", "stirpis"],
  ops: ["ops", "opis"],
  trabs: ["trabs", "trabis"],
  lux: ["lux", "lu-cis"],
  civitas: ["cìvitas", "civitatis"],
  dolor: ["do-lor", "dolóris"],
  sermo: ["sermo", "sermónis"],
  lex: ["lex", "legis"],
  laus: ["laúss", "lau-dis"],
  sol: ["sol", "so-lis"],
  natio: ["nazio", "nazionis"],
  dux: ["dux", "ducis"]
};
var indice = {};
PAROLE.forEach(function (p) { indice[p[0]] = p; });

function maiuscolo(s) { return s.toLocaleUpperCase("it"); }

var campo = document.getElementById("parola");
var scheda = document.getElementById("scheda");
var daLeggere = "";

// Lettura ad alta voce, solo se il dispositivo ha la sintesi vocale
var bottoneAscolta = document.getElementById("ascolta");
if ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) {
  bottoneAscolta.hidden = false;
  bottoneAscolta.addEventListener("click", function () {
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(daLeggere);
      u.lang = "it-IT";
      u.rate = 0.8;
      window.speechSynthesis.speak(u);
    } catch (e) { /* nessun audio disponibile */ }
  });
}

campo.addEventListener("input", function () {
  var chiave = campo.value.trim().toLowerCase().normalize("NFC");
  if (Object.prototype.hasOwnProperty.call(indice, chiave)) {
    var p = indice[chiave];
    document.getElementById("titolo").textContent = maiuscolo(p[0] + " - " + p[1]);
    document.getElementById("genere").textContent = "SOSTANTIVO " + GENERI[p[2]];
    document.getElementById("significato").textContent = maiuscolo(p[3]);
    var l = LETTURA[p[0]] || [p[0], p[1]];
    daLeggere = l[0] + ", " + l[1] + ". Sostantivo " + GENERI[p[2]].toLowerCase() + ". Significato: " + p[3] + ".";
    scheda.hidden = false;
  } else {
    scheda.hidden = true;
  }
});
campo.focus();
</script>
</body>
</html>
